services:
  # MySQL Database Service
  db:
    image: mysql:${MYSQL_VERSION:-8.0}
    container_name: ${INSTANCE_NAME}_db
    restart: ${RESTART_POLICY:-always}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backups:/backups
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # WordPress Application Service
  wordpress:
    depends_on:
      db:
        condition: service_healthy
    image: wordpress:${WP_VERSION:-latest}
    container_name: ${INSTANCE_NAME}_wordpress
    restart: ${RESTART_POLICY:-always}
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WP_DEBUG:-false}
      WORDPRESS_DEBUG_LOG: ${WP_DEBUG_LOG:-false}
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./wp-config-custom.php:/var/www/html/wp-config-custom.php:ro
    networks:
      - wordpress_network
    labels:
      - "com.example.description=${INSTANCE_NAME} WordPress Application"
      - "com.example.version=${WP_VERSION:-latest}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PHPMyAdmin Service (Optional)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:${PHPMYADMIN_VERSION:-latest}
    container_name: ${INSTANCE_NAME}_phpmyadmin
    restart: ${RESTART_POLICY:-always}
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      PMA_ABSOLUTE_URI: http://${DOMAIN_NAME}:${PHPMYADMIN_PORT:-8080}/
      UPLOAD_LIMIT: 300M
    networks:
      - wordpress_network
    depends_on:
      - db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # NGINX Reverse Proxy Service
  nginx-proxy:
    image: jwilder/nginx-proxy:alpine
    container_name: ${INSTANCE_NAME}_nginx_proxy
    restart: ${RESTART_POLICY:-always}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs:ro
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - wordpress_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Let's Encrypt SSL Certificate Service
  letsencrypt-nginx-proxy-companion:
    image: jrcs/letsencrypt-nginx-proxy-companion:latest
    container_name: ${INSTANCE_NAME}_letsencrypt
    restart: ${RESTART_POLICY:-always}
    environment:
      NGINX_PROXY_CONTAINER: ${INSTANCE_NAME}_nginx_proxy
      ACME_TLS_SN_PARAM: --preferred-chain="ISRG Root X1"
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
    networks:
      - wordpress_network
    depends_on:
      - nginx-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
    driver: local

networks:
  wordpress_network:
    driver: bridge
    name: ${INSTANCE_NAME}_network
